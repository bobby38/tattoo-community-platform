[phases.setup]
nixPkgs = ["nodejs_18"]
aptPkgs = ["openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node server.js"
onlyIncludeFiles = [".next/**", "node_modules/**", "public/**", "package.json", "next.config.mjs", "server.js"]

[variables]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
