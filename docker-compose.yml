version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - tattoo-network
    env_file:
      - .env.docker

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ink2tattoo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tattoo-network
    restart: unless-stopped
    env_file:
      - .env.docker

networks:
  tattoo-network:
    driver: bridge

volumes:
  postgres-data:
